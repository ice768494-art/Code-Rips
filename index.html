<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>CodeRips</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #101010;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
      padding: 32px 22px;
      background: #191919;
      border: 1px solid #303030;
      border-radius: 18px;
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #28204a;
      font-size: 42px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    p {
      color: #b8b8b8;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .join-button {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      background: #229ed9;
      color: white;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .join-button:hover {
      background: #168ac0;
    }

    .footer {
      margin-top: 20px;
      margin-bottom: 0;
      font-size: 12px;
      color: #777;
    }
  </style></head><body>
  <main class="container">
    <div class="logo">🎌</div><h1>AnimeNetworkTamil</h1>

<p>
  Welcome to CodeRips!<br>
  Tap below to request access to our private Telegram channel.
</p>

<a
  class="join-button"
  href="Your_Channel_Link"
  target="_blank"
  rel="noopener noreferrer"
>
  ✈️ Join Telegram Channel
</a>

<p class="footer">
  CodeRips • Official Channel
</p>

  </main>
</body>
</html>
